name: duanju_feifei
description: 独立运行的多端短剧应用
publish_to: none
# 版本号从主播放内核 media_kit 版本起定（用户裁定 2026-11-03）
version: 1.2.6+103

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  flutter_foreground_task: 11.0.3
  ffmpeg_kit_flutter_new_min_gpl: 2.6.7
  file_picker: 13.3.2
  crypto: ^3.0.7
  window_manager: ^0.5.1
  package_info_plus: ^10.2.2
  # 钉 ^1.9.0：flutter_miuix 1.3.0 依赖 dynamic_color ^1.9.0，2.x 与其类型不兼容；
  # 本仓仅用 getCorePalette/getAccentColor 两 API，1.9 全具备（理由记经验.md）
  dynamic_color: ^1.9.0
  url_launcher: ^6.3.3
  lpinyin: ^2.0.3
  # MIUI/HyperOS 风格组件库（miuix 官方 Flutter 移植，Apache-2.0）
  flutter_miuix: ^1.3.0
  # 悬浮玻璃底栏（真 shader 模糊，MIT；安卓 Vulkan 走完整管线）
  liquid_glass_widgets: ^1.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  shared_preferences_windows:
    path: packages/shared_preferences_windows

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
